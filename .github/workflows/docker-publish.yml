name: Docker

on:
  push:
    branches: [main, dev, release]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [main, dev]

env:
  REGISTRY: docker.io
  IMAGE_NAME: thomasenzlein/m2ara
  GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
  R_LIBS_USER: /home/runner/work/_temp/Library

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.2'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev libssl-dev libxml2-dev \
            build-essential libgit2-dev libudunits2-dev librsvg2-dev \
            tk libharfbuzz-dev libfribidi-dev

      - name: Create R library path
        run: mkdir -p $R_LIBS_USER

      # Cache compiled R packages
      - name: Cache R library
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-R-${{ hashFiles('req.txt') }}
          restore-keys: |
            ${{ runner.os }}-R-

      - name: Ensure pak cache dir exists
        run: mkdir -p ~/.cache/R/pak

      # Cache pak’s binary download cache
      - name: Cache pak downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/R/pak
          key: ${{ runner.os }}-pak-${{ hashFiles('req.txt') }}
          restore-keys: |
            ${{ runner.os }}-pak-

      - name: Install R packages from req.txt
        run: |
          R -e "install.packages('pak')"
          R -e "packages <- readLines('req.txt'); pak::pkg_install(packages)"

      - name: Install MALDIcellassay
        run: R -e "pak::pkg_install('CeMOS-Mannheim/MALDIcellassay')"

      - name: Install Chromium for shinytest2
        run: sudo apt-get install -y chromium-browser

      - name: Ensure testthat installed
        run: R -e "if (!require('testthat')) pak::pkg_install('testthat')"

      - name: Run R tests
        run: R -e "source('tests/testthat.R')"

      # --- Docker build and push (only if not PR) ---
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.dockeriouser }}
          password: ${{ secrets.dockeriopwd }}

      - name: Cache Docker layers
        id: cache-docker-layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
