name: Docker

on:
  push:
    branches: [main, dev, release]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [main, dev]

env:
  REGISTRY: docker.io
  IMAGE_NAME: thomasenzlein/m2ara
  GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
  R_LIBS_USER: /home/runner/work/_temp/Library
  # R 4.3.2 no longer works: packages from req.txt (e.g. sparsepca) require
  # R >= 4.4. "release" follows the current R release, like the installer build.
  R_VERSION: 'release'
  # Frozen CRAN snapshot: the package versions are pinned in pak.lock, which was
  # created from this snapshot. A check step verifies that the installed
  # versions match the lockfile.
  R_SNAPSHOT: '2026-11-17'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ env.R_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev libssl-dev libxml2-dev \
            build-essential libgit2-dev libudunits2-dev librsvg2-dev \
            tk libharfbuzz-dev libfribidi-dev

      - name: Create R library path
        run: mkdir -p $R_LIBS_USER

      # Cache compiled R packages
      - name: Cache R library
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-R-${{ env.R_VERSION }}-${{ hashFiles('req.txt') }}
          restore-keys: |
            ${{ runner.os }}-R-${{ env.R_VERSION }}-

      - name: Ensure pak cache dir exists
        run: mkdir -p ~/.cache/R/pak

      # Cache pak’s binary download cache
      - name: Cache pak downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/R/pak
          key: ${{ runner.os }}-pak-${{ env.R_VERSION }}-${{ hashFiles('req.txt') }}
          restore-keys: |
            ${{ runner.os }}-pak-${{ env.R_VERSION }}-

      - name: Install R packages (pinned by pak.lock)
        run: |
          export R_SNAPSHOT_URL="https://packagemanager.posit.co/cran/${R_SNAPSHOT}"
          echo "CRAN snapshot: ${R_SNAPSHOT_URL}"
          R -e "install.packages('pak', repos = Sys.getenv('R_SNAPSHOT_URL'))"
          R -e "options(repos = c(CRAN = Sys.getenv('R_SNAPSHOT_URL'))); pak::pkg_install(readLines('req.txt'))"

      - name: Install MALDIcellassay (commit pinned in pak.lock)
        run: Rscript tools/install-maldi-from-lock.R

      - name: Verify packages against pak.lock
        run: Rscript tools/check-lockfile.R "$R_LIBS_USER"

      - name: Install Chromium for shinytest2
        run: sudo apt-get install -y chromium-browser

      - name: Ensure testthat installed
        run: R -e "if (!require('testthat')) pak::pkg_install('testthat')"

      - name: Check dependency lists
        run: Rscript tools/check-dependencies.R

      - name: Install the M2ara package
        run: R CMD INSTALL --no-multiarch --no-byte-compile .

      # Runs the test suite (including the shinytest2 workflow test) from a clean
      # check environment, i.e. the same way a user would install the package.
      - name: Build and check the package
        run: |
          R CMD build --no-build-vignettes --no-manual .
          R CMD check --no-manual --no-vignettes M2ara_*.tar.gz

      - name: Lint R code (informational)
        continue-on-error: true
        run: Rscript tools/lint.R

      # --- Docker build and push (only if not PR) ---
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.dockeriouser }}
          password: ${{ secrets.dockeriopwd }}

      - name: Cache Docker layers
        id: cache-docker-layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
